version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new version waits before Dependabot proposes it: most malicious releases
    # are found and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # 2.x has no qrcode.js (the file /p serves); adapt build.mjs before moving
      - dependency-name: qrcode-generator
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
