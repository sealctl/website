name: Claude Code Review

# An AI code review on every pull request from this repository (collaborators only: the repo
# limits pull request creation to collaborators). It comments; it never approves, pushes or
# merges, and it is not a required check.
#
# Secret on a pull_request job: CLAUDE_CODE_OAUTH_TOKEN is the one exception to "no secrets on
# pull_request jobs" (owner decision, 2026-11-23). It is safe enough here because pull requests
# come only from collaborators (not forks: the `if` below skips fork and Dependabot pull
# requests, which get no secrets anyway), the token can only use the owner's Claude quota (it
# has no repository or cloud access), and the job's own GITHUB_TOKEN is read-only.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  # one review per pull request; a new push cancels the review of the old one
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # the action exchanges it for its GitHub App token to post review comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@b5e37652b7d48df841bfddfd6520610e19bf3136 # v1.0.287
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
