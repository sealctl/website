name: Deploy

# Every deploy of sealctl.com runs in GitHub Actions, never from a laptop (README, "Deploy").
#   push to main, monthly schedule, manual run on main → production (environment `production`)
#   pull request                                         → build and check only, uploads `dist`
# Previews are deployed by preview.yml (workflow_run), whose definition always comes from main;
# no job in this file holds a secret on a pull request.
# The build runs without secrets; the deploy job installs from the lockfile again and only
# runs wrangler. Without CLOUDFLARE_API_TOKEN in the environment the deploy is skipped.

on:
  push:
    branches: [main]
  pull_request:
  # security.txt carries Expires = build date + 365 days; rebuild monthly so it never lapses.
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # one run per pull request (a new push cancels the old run); push, schedule and manual runs
  # get a group of their own, so a run on main is never cancelled or replaced. The production
  # job below has its own group, so deploys still run one at a time.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The only build: pull requests and main (it was also in a separate ci.yml, now removed).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs; Dependabot moves them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # build.mjs dates pages from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run build
        env:
          # Public client-side tokens (repository variables); empty → /pay says checkout isn't set up.
          PADDLE_CLIENT_TOKEN_LIVE: ${{ vars.PADDLE_CLIENT_TOKEN_LIVE }}
          PADDLE_CLIENT_TOKEN_SANDBOX: ${{ vars.PADDLE_CLIENT_TOKEN_SANDBOX }}
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  production:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://sealctl.com
    # Production deploys queue; one never cancels another half way. (GitHub keeps one waiting
    # deploy per group: if two merges wait, the older waiting one is dropped and the newer,
    # which contains it, deploys.)
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — deploy skipped"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.set == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # wrangler comes from the lockfile, never npx <tool>@latest.
      - if: steps.token.outputs.set == 'true'
        run: npm ci --ignore-scripts && npm audit signatures
      - if: steps.token.outputs.set == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - if: steps.token.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npm exec --no -- wrangler pages deploy dist --project-name sealctl-website --branch main --commit-hash "$GITHUB_SHA"
