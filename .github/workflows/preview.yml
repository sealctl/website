name: Preview

# Deploys a preview of a same-repo pull request after its "Deploy" run (deploy.yml) built
# and checked it. A workflow_run workflow always runs the definition on main, so a pull
# request cannot change this file, package.json, the lockfile or .npmrc to reach the token.
# Only data comes from the pull request: the `dist` artifact, minus any Worker code.
# Without CLOUDFLARE_API_TOKEN in the `preview` environment the deploy is skipped.

on:
  # zizmor: ignore[dangerous-triggers] -- runs main's definition; no pull request code runs
  # with the token, only the built `dist` is taken from the run (see the comment above).
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions: {}

jobs:
  preview:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/deploy.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # download the artifact of the triggering run
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: pages-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      alias: ${{ steps.deploy.outputs.alias }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::not a branch of this repository"
            exit 1
          fi
          # A preview never goes to the production branch, and the name goes to wrangler as is.
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$'; then
            echo "::error::branch name not accepted for a preview"
            exit 1
          fi
          case "$BRANCH" in -*)
            echo "::error::branch name not accepted for a preview"
            exit 1 ;;
          esac
          if [ "$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')" = "main" ]; then
            echo "::error::main cannot be a preview"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set — preview skipped"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      # Tooling only, from the default branch: trusted package.json, lockfile and .npmrc.
      - if: steps.check.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - if: steps.check.outputs.set == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # wrangler comes from main's lockfile, never npx <tool>@latest.
      - if: steps.check.outputs.set == 'true'
        run: npm ci --ignore-scripts && npm audit signatures
      # Only the built site comes from the pull request, outside the checkout.
      - if: steps.check.outputs.set == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: deploy
        if: steps.check.outputs.set == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # No Worker or Functions code from a pull request reaches the preview.
          rm -rf "$RUNNER_TEMP/dist/_worker.js" "$RUNNER_TEMP/dist/functions"
          npm exec --no -- wrangler pages deploy "$RUNNER_TEMP/dist" --project-name sealctl-website --branch="$BRANCH" --commit-hash="$HEAD_SHA"
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          alias=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

  # The only job that can write to the pull request; it runs no repository code.
  comment:
    needs: preview
    if: needs.preview.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ needs.preview.outputs.url }}
          ALIAS: ${{ needs.preview.outputs.alias }}
        run: |
          if ! printf '%s' "$PR" | grep -Eq '^[0-9]+$'; then
            echo "::notice::no pull request on the triggering run — comment skipped"
            exit 0
          fi
          marker='<!-- sealctl-pages-preview -->'
          body="$marker
          **Preview:** $URL"
          if [ -n "$ALIAS" ] && [ "$ALIAS" != "$URL" ]; then
            body="$body
          **Branch alias:** $ALIAS"
          fi
          body="$body

          Built from $SHA."
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
