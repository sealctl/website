<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{fullTitle}}</title>
<meta name="description" content="{{description}}">
{{robots}}<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="sealctl">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e121a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/assets/js/theme.js"></script>
<link rel="stylesheet" href="/assets/site.css">
{{scripts}}</head>
<body class="{{bodyClass}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/" aria-label="sealctl home">
      <img class="mark-light" src="/assets/img/mark.svg" width="28" height="28" alt="">
      <img class="mark-dark" src="/assets/img/mark-dark.svg" width="28" height="28" alt="">
      <span class="wordmark">sealctl</span>
    </a>
    <nav class="nav-wide" aria-label="Main">
      <ul>{{navItems}}</ul>
    </nav>
    <a class="nav-gh" href="https://github.com/sealctl">GitHub</a>
    <button class="theme-toggle" type="button" aria-label="Change theme" hidden>
      <svg class="ti ti-auto" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <svg class="ti ti-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ti ti-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
    </button>
    <details class="nav-menu">
      <summary>Menu</summary>
      <nav aria-label="Menu">
        <ul>{{navItems}}<li><a href="https://github.com/sealctl">GitHub</a></li></ul>
      </nav>
    </details>
  </div>
</header>
<main id="main">
{{body}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <div class="footer-row">
      <span class="wordmark">sealctl</span>
      <nav aria-label="Footer">
        <ul>{{footerItems}}</ul>
      </nav>
      <span class="footer-paddle">Payments by Paddle</span>
    </div>
    <p class="footer-legal">© {{year}} <span class="placeholder">{{seller.legalName}}</span></p>
  </div>
</footer>
<div id="live" class="sr-only" aria-live="polite"></div>
</body>
</html>
