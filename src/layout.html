<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{fullTitle}}</title>
<meta name="description" content="{{description}}">
{{robots}}<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="sealctl">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e121a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
{{scripts}}</head>
<body class="{{bodyClass}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="/" aria-label="sealctl home">
      <picture>
        <source srcset="/assets/img/mark-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="/assets/img/mark.svg" width="28" height="28" alt="">
      </picture>
      <span class="wordmark">sealctl</span>
    </a>
    <nav class="nav-wide" aria-label="Main">
      <ul>{{navItems}}</ul>
    </nav>
    <a class="nav-gh" href="https://github.com/sealctl">GitHub</a>
    <details class="nav-menu">
      <summary>Menu</summary>
      <nav aria-label="Menu">
        <ul>{{navItems}}<li><a href="https://github.com/sealctl">GitHub</a></li></ul>
      </nav>
    </details>
  </div>
</header>
{{strip}}<main id="main">
{{body}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <div class="footer-row">
      <span class="wordmark">sealctl</span>
      <nav aria-label="Footer">
        <ul>{{footerItems}}</ul>
      </nav>
      <span class="footer-paddle">Payments by Paddle</span>
    </div>
    <p class="footer-legal">© {{year}} <span class="placeholder">{{seller.legalName}}</span></p>
  </div>
</footer>
<div id="live" class="sr-only" aria-live="polite"></div>
</body>
</html>
